<svg width="800" height="320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes typeLine1 {
        0%, 10% { width: 0; }
        25% { width: 340px; }
        100% { width: 340px; }
      }
      @keyframes typeLine2 {
        0%, 25% { width: 0; }
        40% { width: 420px; }
        100% { width: 420px; }
      }
      @keyframes typeLine3 {
        0%, 40% { width: 0; }
        55% { width: 300px; }
        100% { width: 300px; }
      }
      @keyframes typeLine4 {
        0%, 55% { width: 0; }
        75% { width: 530px; }
        100% { width: 530px; }
      }
      @keyframes typeLine5 {
        0%, 75% { width: 0; }
        90% { width: 270px; }
        100% { width: 270px; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes fadeIn {
        0%, 90% { opacity: 0; }
        100% { opacity: 1; }
      }
      .terminal-title {
        font-family: 'Courier New', monospace;
        font-size: 13px;
        fill: #8b949e;
      }
      .line-number {
        font-family: 'Courier New', monospace;
        font-size: 14px;
        fill: #484f58;
      }
      .code-keyword {
        font-family: 'Courier New', monospace;
        font-size: 14px;
        fill: #ff7b72;
      }
      .code-variable {
        font-family: 'Courier New', monospace;
        font-size: 14px;
        fill: #79c0ff;
      }
      .code-string {
        font-family: 'Courier New', monospace;
        font-size: 14px;
        fill: #a5d6ff;
      }
      .code-property {
        font-family: 'Courier New', monospace;
        font-size: 14px;
        fill: #d2a8ff;
      }
      .code-bracket {
        font-family: 'Courier New', monospace;
        font-size: 14px;
        fill: #e6edf3;
      }
      .code-comment {
        font-family: 'Courier New', monospace;
        font-size: 14px;
        fill: #8b949e;
        font-style: italic;
      }
      .code-evonia {
        font-family: 'Courier New', monospace;
        font-size: 14px;
        fill: #00b3ff;
        font-weight: bold;
      }
      .code-tech {
        font-family: 'Courier New', monospace;
        font-size: 14px;
        fill: #ff6a00;
        font-weight: bold;
      }
      .code-array {
        font-family: 'Courier New', monospace;
        font-size: 14px;
        fill: #7ee787;
      }
      .mask1 { animation: typeLine1 6s steps(40) infinite; }
      .mask2 { animation: typeLine2 6s steps(40) infinite; }
      .mask3 { animation: typeLine3 6s steps(40) infinite; }
      .mask4 { animation: typeLine4 6s steps(40) infinite; }
      .mask5 { animation: typeLine5 6s steps(40) infinite; }
      .cursor {
        animation: blink 1s step-end infinite, fadeIn 6s steps(1) infinite;
        fill: #e6edf3;
      }
    </style>

    <!-- Clip masks for typing effect -->
    <clipPath id="clip1"><rect class="mask1" x="70" y="68" height="20"/></clipPath>
    <clipPath id="clip2"><rect class="mask2" x="70" y="93" height="20"/></clipPath>
    <clipPath id="clip3"><rect class="mask3" x="70" y="118" height="20"/></clipPath>
    <clipPath id="clip4"><rect class="mask4" x="70" y="143" height="20"/></clipPath>
    <clipPath id="clip5"><rect class="mask5" x="70" y="168" height="20"/></clipPath>
  </defs>

  <!-- Window -->
  <rect width="800" height="320" fill="#0d1117" rx="10"/>

  <!-- Title bar -->
  <rect width="800" height="35" fill="#161b22" rx="10"/>
  <rect x="0" y="25" width="800" height="10" fill="#161b22"/>

  <!-- Window buttons -->
  <circle cx="20" cy="17" r="6" fill="#f85149"/>
  <circle cx="40" cy="17" r="6" fill="#d29922"/>
  <circle cx="60" cy="17" r="6" fill="#3fb950"/>

  <!-- Window title -->
  <text class="terminal-title" x="400" y="22" text-anchor="middle">evonia.config.ts — Evonia Tech</text>

  <!-- Line numbers -->
  <text class="line-number" x="30" y="82" text-anchor="end">1</text>
  <text class="line-number" x="30" y="107" text-anchor="end">2</text>
  <text class="line-number" x="30" y="132" text-anchor="end">3</text>
  <text class="line-number" x="30" y="157" text-anchor="end">4</text>
  <text class="line-number" x="30" y="182" text-anchor="end">5</text>
  <text class="line-number" x="30" y="207" text-anchor="end">6</text>
  <text class="line-number" x="30" y="232" text-anchor="end">7</text>
  <text class="line-number" x="30" y="257" text-anchor="end">8</text>
  <text class="line-number" x="30" y="282" text-anchor="end">9</text>

  <!-- Separator line -->
  <line x1="42" y1="40" x2="42" y2="320" stroke="#21262d" stroke-width="1"/>

  <!-- Line 1: comment -->
  <g clip-path="url(#clip1)">
    <text class="code-comment" x="55" y="82">// evonia.config.ts</text>
  </g>

  <!-- Line 2: const developer -->
  <g clip-path="url(#clip2)">
    <text class="code-keyword" x="55" y="107">const</text>
    <text class="code-variable" x="102" y="107"> developer</text>
    <text class="code-bracket" x="190" y="107"> = {</text>
  </g>

  <!-- Line 3: name -->
  <g clip-path="url(#clip3)">
    <text class="code-property" x="80" y="132">name</text>
    <text class="code-bracket" x="120" y="132">:</text>
    <text class="code-string" x="140" y="132">"function Sebiiih() { return "Sébastien" }"</text>
    <text class="code-bracket" x="362" y="132">,</text>
  </g>

  <!-- Line 4: role -->
  <g clip-path="url(#clip4)">
    <text class="code-property" x="80" y="157">role</text>
    <text class="code-bracket" x="120" y="157">:</text>
    <text class="code-string" x="140" y="157">"Développeur Full-Stack"</text>
    <text class="code-bracket" x="378" y="157">,</text>
  </g>

  <!-- Line 5: company with Evonia in blue and Tech in orange -->
  <g clip-path="url(#clip5)">
    <text class="code-property" x="80" y="182">company</text>
    <text class="code-bracket" x="148" y="182">:</text>
    <text class="code-bracket" x="163" y="182">"</text>
    <text class="code-evonia" x="172" y="182">Evonia</text>
    <text class="code-bracket" x="223" y="182">.</text>
    <text class="code-tech" x="231" y="182">tech</text>
    <text class="code-bracket" x="267" y="182">"</text>
    <text class="code-bracket" x="276" y="182">,</text>
  </g>

  <!-- Line 6: stack (no animation) -->
  <text class="code-property" x="80" y="207" opacity="0.9">stack</text>
  <text class="code-bracket" x="120" y="207" opacity="0.9">:</text>
  <text class="code-bracket" x="138" y="207" opacity="0.9">[</text>
  <text class="code-array" x="148" y="207" opacity="0.9">"React"</text>
  <text class="code-bracket" x="205" y="207" opacity="0.9">,</text>
  <text class="code-array" x="218" y="207" opacity="0.9">"Next.js"</text>
  <text class="code-bracket" x="290" y="207" opacity="0.9">,</text>
  <text class="code-array" x="303" y="207" opacity="0.9">"TypeScript"</text>
  <text class="code-bracket" x="400" y="207" opacity="0.9">,</text>
  <text class="code-array" x="413" y="207" opacity="0.9">"Node.js"</text>
  <text class="code-bracket" x="485" y="207" opacity="0.9">]</text>
  <text class="code-bracket" x="494" y="207" opacity="0.9">,</text>

  <!-- Line 7: passion -->
  <text class="code-property" x="80" y="232" opacity="0.9">passion</text>
  <text class="code-bracket" x="148" y="232" opacity="0.9">:</text>
  <text class="code-string" x="163" y="232" opacity="0.9">"Web • Mobile • IA"</text>

  <!-- Line 8: closing bracket -->
  <text class="code-bracket" x="55" y="257" opacity="0.9">};</text>

  <!-- Line 9: export -->
  <text class="code-keyword" x="55" y="282" opacity="0.7">export default</text>
  <text class="code-variable" x="190" y="282" opacity="0.7"> developer;</text>

  <!-- Blinking cursor -->
  <rect class="cursor" x="290" y="270" width="8" height="16" rx="1"/>
</svg>
